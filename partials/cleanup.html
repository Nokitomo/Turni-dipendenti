<section id="cleanup-section">
  <h2>Pulizia Automatica dei Dati</h2>
  <label for="cleanup-select">Rimuovi dati più vecchi di:</label>
  <select id="cleanup-select">
    <option value="off">Off</option>
    <option value="3">3 mesi</option>
    <option value="6">6 mesi</option>
    <option value="12">1 anno</option>
  </select>
  <p class="cleanup-hint">La pulizia elimina i turni più vecchi in base all'intervallo selezionato.</p>
</section>
