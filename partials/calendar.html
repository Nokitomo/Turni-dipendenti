<section class="page-calendar">
  <section id="week-navigation">
    <div class="calendar-icon-container">
      <button id="calendar-icon" aria-label="Apri calendario">📅</button>
    </div>
    <div class="calendar-popup hidden" id="calendar-popup">
      <input id="calendar-selector" type="text" aria-hidden="true" />
    </div>
    <div class="date-row">
      <button id="prev-week" aria-label="Settimana precedente">&#9664;</button>
      <div class="current-date" id="current-week-label"></div>
      <button id="next-week" aria-label="Settimana successiva">&#9654;</button>
    </div>
    <div class="today-btn">
      <button id="today">Oggi</button>
    </div>
  </section>

  <section id="calendar-section">
    <h2>Calendario Turni</h2>
    <div id="calendar"></div>
  </section>

  <section id="export-section">
    <button id="export-pdf">Esporta PDF</button>
  </section>
</section>
